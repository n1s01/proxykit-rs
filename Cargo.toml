[package]
name = "proxykit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Proxy parsing, protocol detection, HTTP/HTTPS/SOCKS5 tunnels, checks, VPN bypass and a browser relay"
license = "MIT"
repository = "https://github.com/n1s01/proxykit-rs"
keywords = ["proxy", "socks5", "http-connect", "tokio", "vpn"]
categories = ["network-programming", "asynchronous"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
httparse = "1"
humantime = "2"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-service = "0.3"
url = "2"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
